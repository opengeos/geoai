name: Publish

on:
    release:
        types: [published]
    workflow_dispatch:
        inputs:
            tag:
                description: "Release tag to publish (must already exist on GitHub)"
                required: true
                type: string
            upload_qgis_repo:
                description: "Upload plugin zip to plugins.qgis.org"
                required: false
                default: true
                type: boolean

permissions:
    contents: read

jobs:
    publish:
        name: Publish plugin to plugins.qgis.org
        runs-on: ubuntu-latest
        # Write access is needed only for attaching the plugin zip asset to the GitHub release.
        permissions:
            contents: write
        env:
            TAG: ${{ github.event.release.tag_name || inputs.tag }}
            PLUGIN_DIR: qgis_plugin/geoai
            PLUGIN_NAME: geoai
            ZIP_PATH: dist/geoai.zip
        steps:
            - uses: actions/checkout@v7
              with:
                  ref: ${{ inputs.tag || github.sha }}
                  fetch-depth: 0

            - uses: actions/setup-python@v7
              with:
                  python-version: "3.13"

            - name: Read plugin version
              id: plugin_version
              run: |
                  plugin_version=$(grep '^version=' "$PLUGIN_DIR/metadata.txt" | cut -d'=' -f2 | tr -d '[:space:]')
                  if [ -z "$plugin_version" ]; then
                      echo "::error::Could not read plugin version from $PLUGIN_DIR/metadata.txt"
                      exit 1
                  fi
                  if ! echo "$plugin_version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([.-].+)?$'; then
                      echo "::error::Plugin version '$plugin_version' is not a valid version string"
                      exit 1
                  fi
                  echo "version=$plugin_version" >> "$GITHUB_OUTPUT"
                  echo "Release tag (package): $TAG"
                  echo "Plugin version (metadata.txt): $plugin_version"

            - name: Check whether QGIS plugin metadata changed
              id: plugin_change
              env:
                  EVENT_NAME: ${{ github.event_name }}
                  UPLOAD_QGIS_REPO: ${{ inputs.upload_qgis_repo }}
              run: |
                  if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
                      if [ "$UPLOAD_QGIS_REPO" = "false" ]; then
                          echo "should_upload=false" >> "$GITHUB_OUTPUT"
                          echo "Skipping plugins.qgis.org upload (upload_qgis_repo=false)."
                      else
                          echo "should_upload=true" >> "$GITHUB_OUTPUT"
                          echo "Manual dispatch requested plugins.qgis.org upload."
                      fi
                      exit 0
                  fi

                  prev_tag=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
                  if [ -z "$prev_tag" ]; then
                      echo "should_upload=true" >> "$GITHUB_OUTPUT"
                      echo "No previous tag found; proceeding with plugins.qgis.org upload."
                      exit 0
                  fi

                  if git diff --quiet "$prev_tag" HEAD -- "$PLUGIN_DIR/metadata.txt"; then
                      echo "should_upload=false" >> "$GITHUB_OUTPUT"
                      echo "$PLUGIN_DIR/metadata.txt unchanged since $prev_tag; skipping plugins.qgis.org upload."
                  else
                      echo "should_upload=true" >> "$GITHUB_OUTPUT"
                      echo "$PLUGIN_DIR/metadata.txt changed since $prev_tag; proceeding with plugins.qgis.org upload."
                  fi

            - name: Build plugin zip
              run: python "qgis_plugin/package_plugin.py" --source "$PLUGIN_DIR" --output "$ZIP_PATH"

            - name: Attach zip to GitHub release
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  gh release upload "$TAG" "$ZIP_PATH" --clobber

            - name: Upload to plugins.qgis.org
              if: steps.plugin_change.outputs.should_upload == 'true'
              env:
                  QGIS_PLUGIN_REPO_USERNAME: ${{ secrets.QGIS_PLUGIN_REPO_USERNAME }}
                  QGIS_PLUGIN_REPO_PASSWORD: ${{ secrets.QGIS_PLUGIN_REPO_PASSWORD }}
              run: python scripts/upload_to_qgis_plugin_repo.py "$ZIP_PATH"
