on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main

name: macOS build

permissions:
    contents: read

jobs:
    test-macOS:
        runs-on: macos-latest
        name: macOS (${{ matrix.python-version }})
        strategy:
            fail-fast: false
            matrix:
                python-version: ["3.12", "3.13", "3.14"]
        env:
            SDKROOT: /Library/Developer/CommandLineTools/SDKs/MacOSX.sdk
        steps:
            - uses: actions/checkout@v7

            - name: Install uv
              uses: astral-sh/setup-uv@v7
              with:
                  version: ""
                  enable-cache: false

            - name: Set up Python ${{ matrix.python-version }}
              run: uv python install ${{ matrix.python-version }}

            - name: Install dependencies
              run: |
                  uv venv --python ${{ matrix.python-version }}
                  uv pip install . pytest

            - name: Test import and CLI
              run: |
                  .venv/bin/python -c "import geoai; print('geoai', geoai.__version__)"
                  .venv/bin/geoai --help

            - name: Run lightweight smoke tests
              run: |
                  .venv/bin/python -m pytest tests/test_lazy_import.py tests/test_cli.py -v
